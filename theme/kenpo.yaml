# 憲法 テーマ体系 素案 v0.1
#
# 規則は「テーマ体系の作り方（素案づくり用の手引き）」に従う。
# - kind: structure（構造エリア）／ issue（論点エリア）
# - 構造エリアと論点の第1段は親を複数持てる。論点の第2・3段は親（論点）を1つだけ持つ
# - 論点エリアは最大3段
# - kind: theory（学説）は論点の子として1段使うが、論点の「最大3段」には数えない。ページでは「学説」のグループにまとめて出す
# - 書いていない項目（aliases / related / memo）は空とみなす
# - related は向きを持たないので、片側にだけ書く
# - 構造エリアの ID は科目の接頭辞（kenpo-）を付ける。論点の ID は接頭辞なし
# 迷った点・決めきれなかった点は kenpo_memo.md にまとめている。

# ============================================================
# 構造エリア（structure）
# ============================================================

- id: kenpo
  name: 憲法
  kind: structure
  parents: []
  aliases: []
  related: []
  memo: ""

# ---- 憲法総論 ----

- id: kenpo-souron
  name: 憲法総論
  kind: structure
  parents: [kenpo]

- id: kenpo-kokumin-shuken
  name: 国民主権
  kind: structure
  parents: [kenpo-souron, kenpo-tochi]
  memo: 基本書では総論（基本原理）に置くことが多いが、統治の原理でもある

- id: kenpo-heiwa-shugi
  name: 平和主義
  kind: structure
  parents: [kenpo-souron]

- id: kenpo-tennou
  name: 天皇
  kind: structure
  parents: [kenpo-souron, kenpo-tochi]
  memo: 総論と統治の間に章を立てる本が多い。両方を親にした

# ---- 人権 ----

- id: kenpo-jinken
  name: 人権
  kind: structure
  parents: [kenpo]
  aliases: [基本的人権]
  memo: 「基本的人権」は日本国憲法の条文上の言い方で、指すものは同じとみてエイリアスにした

- id: kenpo-jinken-souron
  name: 人権総論
  kind: structure
