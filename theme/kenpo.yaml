- id: kenpo-houkatsuteki-kihonken
  name: 包括的基本権
  kind: structure
  parents: [kenpo-jinken-souron, kenpo-jinken-kakuron]
  memo: 13条。法の下の平等と同じく総論・各論の間にある

- id: kenpo-hou-no-moto-no-byoudou
  name: 法の下の平等
  kind: structure
  parents: [kenpo-jinken-souron, kenpo-jinken-kakuron]
