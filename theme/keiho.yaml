  memo: 民法（不法行為）にも「因果関係」があり意味が違うので、科目名を添えた

- id: keiho-koi
  name: 故意（刑法）
  kind: structure
  parents: [keiho-kousei-youken, keiho-sekinin]
  memo: 故意を構成要件の要素とみるか、責任の要素とみるかで体系上の位置が分かれる。両方を親にした。民法の故意と区別するため科目名を添えた

- id: keiho-sakugo
