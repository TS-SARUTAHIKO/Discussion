# 刑法 テーマ体系 素案 v0.1
#
# 規則は「テーマ体系の作り方（素案づくり用の手引き）」に従う。書き方は kenpo.yaml と同じ。
# - kind: structure（構造エリア）／ issue（論点エリア）
# - 構造エリアと論点の第1段は親を複数持てる。論点の第2・3段は親（論点）を1つだけ持つ
# - 論点エリアは最大3段
# - 書いていない項目（aliases / related / memo）は空とみなす
# - related は向きを持たないので、片側にだけ書く。憲法のテーマとの関連もこちら側に書いた
# - 構造エリアの ID は科目の接頭辞（keiho-）を付ける。論点の ID は接頭辞なし
# 迷った点・決めきれなかった点は keiho_memo.md にまとめている。

# ============================================================
# 構造エリア（structure）
# ============================================================

- id: keiho
  name: 刑法
  kind: structure
  parents: []
  aliases: []
  related: []
  memo: ""

# ---- 刑法総論 ----

- id: keiho-souron
  name: 刑法総論
  kind: structure
  parents: [keiho]

- id: keiho-kiso
  name: 刑法の基礎
  kind: structure
  parents: [keiho-souron]
  memo: 刑法の機能・罪刑法定主義・適用範囲など、犯罪論に入る前の部分の枠

- id: keiho-zaikei-houtei-shugi
  name: 罪刑法定主義
  kind: structure
  parents: [keiho-kiso]

- id: keiho-tekiyou-han-i
  name: 刑法の適用範囲
  kind: structure
  parents: [keiho-kiso]

# 構成要件

- id: keiho-kousei-youken
  name: 構成要件
  kind: structure
  parents: [keiho-souron]
  memo: 「構成要件該当性」はエイリアスにしない（構成要件という枠と、それに当たるかという判断は別の意味）

- id: keiho-jikkou-koui
  name: 実行行為
