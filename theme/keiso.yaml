# 刑事訴訟法 テーマ体系 素案 v0.1
#
# 規則は「テーマ体系の作り方（素案づくり用の手引き）」に従う。書き方は kenpo.yaml・keiho.yaml と同じ。
# この科目から、構造エリアに next（次の段階）を試しに足している。
# - next: 手続の上で次に進む段階の ID。向きを持つ。分かれ道は複数書く。構造エリアどうしだけに張る
# - next は親子関係とは別のもの。タグ付けと集計は今までどおり親子関係（樹形図）で行う
# - 手続の流れに乗らない枠（基本原則・訴訟主体・証拠）には next を書かない
# - related は向きを持たないので片側にだけ書く。憲法・刑法のテーマとの関連もこちら側に書いた
# 迷った点・決めきれなかった点は keiso_memo.md にまとめている。

# ============================================================
# 構造エリア（structure）
# ============================================================

- id: keiso
  name: 刑事訴訟法
  kind: structure
  parents: []
  aliases: [刑訴法, 刑訴]
  related: []
  memo: ""

# ---- 流れに乗らない枠 ----

- id: keiso-kihon-gensoku
  name: 刑事訴訟の基本原則
  kind: structure
  parents: [keiso]
  memo: 当事者主義など、どの段階にも出てくる原則の枠

- id: keiso-soshou-shutai
  name: 訴訟主体
  kind: structure
  parents: [keiso]
  memo: 裁判所・検察官・被告人・弁護人

# ---- 手続の大きな流れ：捜査 → 公訴 → 公判 → 裁判 → 上訴 / 非常救済 ----

- id: keiso-sousa
  name: 捜査
  kind: structure
  parents: [keiso]
  next: [keiso-kouso]

- id: keiso-kouso
  name: 公訴
  kind: structure
  parents: [keiso]
  next: [keiso-kouhan, keiso-tokubetsu-tetsuzuki]
  memo: 公判に進むほか、略式手続などの特別な手続に分かれる。不起訴で終わる道は段階として立てていない

- id: keiso-tokubetsu-tetsuzuki
  name: 特別な手続
  kind: structure
  parents: [keiso]
  next: [keiso-saiban]
  memo: 略式手続・即決裁判手続

- id: keiso-kouhan
  name: 公判
  kind: structure
  parents: [keiso]
  next: [keiso-saiban]

- id: keiso-saiban
  name: 裁判（刑事訴訟法）
  kind: structure
  parents: [keiso]
  next: [keiso-jouso, keiso-hijou-kyuusai]
  memo: 「裁判」は憲法（司法）・民事訴訟法でも使う言葉なので科目名を添えた

- id: keiso-jouso
  name: 上訴（刑事訴訟法）
  kind: structure
  parents: [keiso]
  next: [keiso-hijou-kyuusai]
  memo: 上訴が尽きて裁判が確定したあとに非常救済手続がある。差戻しで公判に戻る流れは、細かい段階のほうに書いた

- id: keiso-hijou-kyuusai
  name: 非常救済手続
  kind: structure
  parents: [keiso]
  memo: 再審・非常上告

# ---- 証拠（流れに乗らない大きな枠） ----

- id: keiso-shouko
  name: 証拠（刑事訴訟法）
  kind: structure
  parents: [keiso]
  related: [keiso-shouko-shirabe]
  memo: 公判の証拠調べで使う決まりだが、基本書では独立した大きな章になっているので段階とは別の枠にした

# ---- 捜査の中の段階 ----

- id: keiso-sousa-no-tansho
  name: 捜査の端緒
  kind: structure
  parents: [keiso-sousa]
  memo: 職務質問・所持品検査・告訴・告発・自首など

- id: keiso-nin-i-sousa-to-kyousei-sousa
  name: 任意捜査と強制捜査
  kind: structure
  parents: [keiso-sousa]

- id: keiso-taiho
  name: 逮捕
  kind: structure
  parents: [keiso-sousa]
  next: [keiso-kouryuu]

- id: keiso-kouryuu
  name: 勾留
  kind: structure
  parents: [keiso-sousa]
  next: [keiso-kouso-no-teiki]
  memo: 起訴後の被告人の勾留もあるが、被疑者の勾留が中心なので捜査の下に置いた

- id: keiso-sousaku-sashiosae
  name: 捜索・差押え
  kind: structure
  parents: [keiso-sousa]

- id: keiso-torishirabe
  name: 取調べ
  kind: structure
  parents: [keiso-sousa]

- id: keiso-higisha-hikokunin-no-bougyo
  name: 被疑者・被告人の防御
  kind: structure
  parents: [keiso-sousa, keiso-kouhan]
  memo: 弁護人・接見交通・黙秘権など。捜査と公判の両方にまたがる

# ---- 公訴の中 ----

- id: keiso-kouso-no-teiki
  name: 公訴の提起
  kind: structure
  parents: [keiso-kouso]
  next: [keiso-kouhan-junbi, keiso-tokubetsu-tetsuzuki]

- id: keiso-soin
  name: 訴因
  kind: structure
  parents: [keiso-kouso, keiso-kouhan]
  memo: 起訴状で示し（公訴）、公判で変更が問題になる（公判）。両方を親にした

# ---- 公判の中の段階 ----

- id: keiso-kouhan-junbi
  name: 公判準備
  kind: structure
  parents: [keiso-kouhan]
  next: [keiso-boutou-tetsuzuki]
  memo: 公判前整理手続を含む

- id: keiso-kouhan-tetsuzuki
  name: 公判手続
  kind: structure
  parents: [keiso-kouhan]
  memo: 冒頭手続・証拠調べ・論告と弁論の枠

- id: keiso-boutou-tetsuzuki
  name: 冒頭手続
  kind: structure
  parents: [keiso-kouhan-tetsuzuki]
  next: [keiso-shouko-shirabe]

- id: keiso-shouko-shirabe
  name: 証拠調べ手続
  kind: structure
  parents: [keiso-kouhan-tetsuzuki]
  next: [keiso-ronkoku-benron]

- id: keiso-ronkoku-benron
  name: 論告・弁論
  kind: structure
  parents: [keiso-kouhan-tetsuzuki]
  next: [keiso-hanketsu]

# ---- 裁判・上訴・非常救済の中 ----

- id: keiso-hanketsu
  name: 判決（刑事訴訟法）
  kind: structure
  parents: [keiso-saiban]
  next: [keiso-jouso-kouso, keiso-saiban-no-kouryoku]
  memo: 控訴されるか、確定して効力が生じるかに分かれる

- id: keiso-saiban-no-kouryoku
  name: 裁判の効力（刑事訴訟法）
  kind: structure
  parents: [keiso-saiban]
  next: [keiso-saishin, keiso-hijou-joukoku]
  memo: 確定した裁判の効力（一事不再理効など）

- id: keiso-jouso-kouso
  name: 控訴
  kind: structure
  parents: [keiso-jouso]
  next: [keiso-jouso-joukoku, keiso-saiban-no-kouryoku, keiso-kouhan-tetsuzuki]
  memo: 公判手続へ戻る矢印は、破棄差戻しの場合

- id: keiso-jouso-joukoku
  name: 上告
  kind: structure
  parents: [keiso-jouso]
  next: [keiso-saiban-no-kouryoku, keiso-kouhan-tetsuzuki]
  memo: 公判手続へ戻る矢印は、破棄差戻しの場合

- id: keiso-jouso-koukoku
  name: 抗告
  kind: structure
  parents: [keiso-jouso]
  memo: 判決ではなく決定・命令に対する不服申立て。判決からの流れには乗らないので next は書いていない

- id: keiso-saishin
  name: 再審
  kind: structure
  parents: [keiso-hijou-kyuusai]
  next: [keiso-kouhan-tetsuzuki]
  memo: 再審開始決定のあと、審判がやり直される

- id: keiso-hijou-joukoku
  name: 非常上告
  kind: structure
  parents: [keiso-hijou-kyuusai]

# ---- 証拠の中 ----

- id: keiso-shouko-no-kihon-gensoku
  name: 証拠法の基本原則
  kind: structure
  parents: [keiso-shouko]

- id: keiso-jihaku
  name: 自白（刑事訴訟法）
  kind: structure
  parents: [keiso-shouko]
  memo: 民事訴訟法の「裁判上の自白」とは意味が違うので科目名を添えた

- id: keiso-denbun-shouko
  name: 伝聞証拠
  kind: structure
  parents: [keiso-shouko]
  aliases: [伝聞法則]
  memo: 「伝聞法則」は伝聞証拠の扱いの決まり全体を指す呼び名として、同じ枠のエイリアスにした。人の確認が必要

- id: keiso-ihou-shuushuu-shouko
  name: 違法収集証拠
  kind: structure
  parents: [keiso-shouko, keiso-sousa]
  memo: 証拠能力の問題だが、もとは捜査の違法の問題なので捜査も親にした

